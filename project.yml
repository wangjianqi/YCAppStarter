name: YCAppStarter
options:
  bundleIdPrefix: com.yuechuanlabs
  deploymentTarget:
    iOS: "17.6"
settings:
  base:
    MARKETING_VERSION: 3.0.0
    CURRENT_PROJECT_VERSION: 300
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: 17.6
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.0.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.0.0
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 12.0.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 3.1.0
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.0.0
targets:
  YCAppStarter:
    type: application
    platform: iOS
    deploymentTarget: "17.6"
    sources:
      - path: Sources/YCAppStarter
      - path: Sources/Shared
    resources:
      - path: Sources/YCAppStarter/Resources
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: Firebase
        product: FirebaseMessaging
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: UserMessagingPlatform
      - package: Supabase
        product: Supabase
      - target: YCAppStarterWidgetsExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuechuanlabs.ycappstarter
        INFOPLIST_FILE: Sources/YCAppStarter/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/YCAppStarter/YCAppStarter.entitlements
        PRODUCT_NAME: YCAppStarter
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets:
        - YCAppStarterTests

  YCAppStarterWidgetsExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.6"
    sources:
      - path: Sources/YCAppStarterWidgets
      - path: Sources/Shared
    resources:
      - path: Sources/YCAppStarterWidgets/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuechuanlabs.ycappstarter.widgets
        INFOPLIST_FILE: Sources/YCAppStarterWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/YCAppStarterWidgets/YCAppStarterWidgets.entitlements
        PRODUCT_NAME: YCAppStarterWidgets
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  YCAppStarterTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.6"
    sources:
      - path: Tests/YCAppStarterTests
    dependencies:
      - target: YCAppStarter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuechuanlabs.ycappstarter.tests
        GENERATE_INFOPLIST_FILE: YES

